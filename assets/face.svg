<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.05); } }
    .head { animation: bob 3s ease-in-out infinite; transform-origin: 100px 100px; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .smile { animation: smile 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes smile { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.25); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bg)" opacity="0.15"/>
  <g class="head">
    <path d="M45 92 C45 40, 155 40, 155 92 C140 70, 60 70, 45 92 Z" fill="#1f2937"/>
    <ellipse cx="100" cy="104" rx="52" ry="58" fill="#f1c9a5"/>
    <path d="M48 92 C48 44, 152 44, 152 92 C138 72, 62 72, 48 92 Z" fill="#1f2937"/>
    <ellipse cx="48" cy="108" rx="7" ry="11" fill="#e8b98f"/>
    <ellipse cx="152" cy="108" rx="7" ry="11" fill="#e8b98f"/>
    <rect x="62" y="92" width="32" height="26" rx="8" fill="none" stroke="#111827" stroke-width="3"/>
    <rect x="106" y="92" width="32" height="26" rx="8" fill="none" stroke="#111827" stroke-width="3"/>
    <line x1="94" y1="104" x2="106" y2="104" stroke="#111827" stroke-width="3"/>
    <g class="blink">
      <ellipse cx="78" cy="105" rx="9" ry="9" fill="#fff"/>
      <ellipse cx="122" cy="105" rx="9" ry="9" fill="#fff"/>
      <circle cx="78" cy="105" r="4.5" fill="#111827">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 3 0; 3 2; -3 0; -3 -1; 0 0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="122" cy="105" r="4.5" fill="#111827">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 3 0; 3 2; -3 0; -3 -1; 0 0" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <path d="M64 86 Q78 80 92 86" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M108 86 Q122 80 136 86" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M100 108 Q96 124 102 126" stroke="#c99871" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="smile" d="M80 140 Q100 158 120 140" stroke="#7f1d1d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
